name: DevSecOps Security Pipeline

# Pipeline tu dong kich hoat khi co push hoac pull request vao nhanh main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # cho phep bam nut "Run workflow" de demo truc tiep

jobs:
  # ============ STAGE 1: SAST - quet ma nguon tinh ============
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (custom ruleset)
        run: |
          pip install semgrep
          semgrep scan --config semgrep-rules.yml app.js --json --output semgrep-report.json || true

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  # ============ STAGE 2: SCA - quet dependency co lo hong ============
  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run npm audit
        run: npm audit --json > sca-report.json || true

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: sca-report.json

  # ============ STAGE 3: DAST - quet ung dung dang chay ============
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start application in background
        run: |
          nohup node app.js > app.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://localhost:3000/ > /dev/null; then
              echo "Ung dung da san sang"
              break
            fi
            sleep 1
          done
          curl -s http://localhost:3000/

      - name: Run OWASP ZAP baseline scan
        run: |
          chmod -R a+rwx "$GITHUB_WORKSPACE"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 \
            -J zap-report.json -r zap-report.html -I || true

      - name: Show DAST report files
        if: always()
        run: ls -la zap-report.* || true

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-report.json
            zap-report.html

  # ============ STAGE 4: QUALITY GATE - tong hop & quyet dinh pass/fail ============
  quality-gate:
    name: Quality Gate
    needs: [sast, sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: semgrep-report

      - uses: actions/download-artifact@v4
        with:
          name: sca-report

      - name: Evaluate Quality Gate
        env:
          MAX_CRITICAL: 0
          MAX_HIGH: 0
        run: node quality-gate.js

      - name: Upload consolidated security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json
